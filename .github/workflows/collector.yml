name: Captura C1
on:
  push:
    branches: [main]
    paths:
      - 'collector.py'
      - 'report.py'
      - 'index.html'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/**'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: c1-capture
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Pruebas automáticas
        run: python -m unittest discover -s tests -v
      - name: Captura oficial
        run: python collector.py
        env:
          GTFS_STATIC_URL: ${{ vars.GTFS_STATIC_URL }}
          TRIP_UPDATES_JSON_URL: ${{ vars.TRIP_UPDATES_JSON_URL }}
      - name: Preparar cuadro de mando incluso si falla captura
        if: always()
        run: python report.py
      - name: Conservar observaciones
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "Captura C1" && git push)
