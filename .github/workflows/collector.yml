name: Captura C1
on:
  workflow_dispatch:
  schedule:
    - cron: '3-58/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'collector.py'
      - 'report.py'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/collector.yml'
permissions:
  contents: write
concurrency:
  group: c1-capture
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Código actualizado
        uses: actions/checkout@v4
        with:
          path: source
          ref: main
      - name: Histórico persistente separado de la web
        uses: actions/checkout@v4
        with:
          path: storage
          ref: datos-c1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias
        run: pip install -r source/requirements.txt
      - name: Pruebas de análisis
        run: python -m unittest discover -s source/tests -v
      - name: Actualizar capturador con la versión del código principal
        run: |
          cp source/collector.py storage/collector.py
          cp source/report.py storage/report.py
      - name: Recoger y guardar cada cinco minutos durante media hora
        working-directory: storage
        env:
          GTFS_STATIC_URL: ${{ vars.GTFS_STATIC_URL }}
          TRIP_UPDATES_JSON_URL: ${{ vars.TRIP_UPDATES_JSON_URL }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          failed=0
          for attempt in 1 2 3 4 5 6 7; do
            echo "::group::Muestra ${attempt} de 7"
            if ! python collector.py; then
              echo "::error::Error de captura en muestra ${attempt}"
              failed=1
            fi
            if ! python report.py; then
              echo "::error::Error al generar el informe en muestra ${attempt}"
              failed=1
            fi
            git add data/
            if ! git diff --cached --quiet; then
              git commit -m "Datos C1 - muestra ${attempt}"
              git pull --rebase origin datos-c1
              git push origin HEAD:datos-c1
            fi
            echo "::endgroup::"
            if [ "$attempt" -lt 7 ]; then
              sleep 300
            fi
          done
          exit "$failed"
